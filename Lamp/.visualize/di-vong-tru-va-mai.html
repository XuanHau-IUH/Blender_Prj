<div id="lamp-loft-lesson">
  <style>
    #lamp-loft-lesson {
      --mesh: color-mix(in srgb, var(--foreground) 42%, var(--background));
      --face: color-mix(in srgb, var(--foreground) 7%, var(--background));
      --light-face: color-mix(in srgb, var(--foreground) 3%, var(--background));
      --corner: var(--viz-series-1, var(--blue));
      --neighbor: var(--viz-series-2, var(--orange));
      color: var(--foreground);
      display: grid;
      gap: calc(var(--font-size-base) * 1);
    }
    #lamp-loft-lesson .lamp-plates {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 185px), 1fr));
      gap: calc(var(--font-size-base) * 1);
    }
    #lamp-loft-lesson figure {
      display: grid;
      gap: calc(var(--font-size-base) * .5);
      align-content: start;
      min-width: 0;
      margin: 0;
    }
    #lamp-loft-lesson figcaption { font-weight: 500; }
    #lamp-loft-lesson svg { display: block; width: 100%; height: 152px; }
    #lamp-loft-lesson .lamp-mesh { stroke: var(--mesh); stroke-width: 1; stroke-linejoin: round; }
    #lamp-loft-lesson .lamp-key { display: flex; flex-wrap: wrap; gap: .5em 1em; }
    #lamp-loft-lesson .lamp-corner { color: var(--corner); }
    #lamp-loft-lesson .lamp-neighbor { color: var(--neighbor); }
    #lamp-loft-lesson .lamp-middle { color: var(--muted-foreground); }
  </style>
  <div class="lamp-plates">
    <figure>
      <figcaption>Trụ nhìn thẳng</figcaption>
      <svg data-drawing="post" role="img" aria-label="Tám vòng ngang tạo chân và vai rộng, eo hẹp."></svg>
    </figure>
    <figure>
      <figcaption>Một vòng mái nhìn từ trên</figcaption>
      <svg data-drawing="ring" role="img" aria-label="Vòng 16 đỉnh gồm 4 đỉnh góc, 8 đỉnh kề góc và 4 đỉnh giữa cạnh."></svg>
      <div class="lamp-key text-small">
        <span><span class="lamp-corner" aria-hidden="true">●</span> Góc</span>
        <span><span class="lamp-neighbor" aria-hidden="true">◆</span> Kề góc</span>
        <span><span class="lamp-middle" aria-hidden="true">▪</span> Giữa cạnh</span>
      </div>
    </figure>
    <figure>
      <figcaption>Mái nhìn chéo</figcaption>
      <svg data-drawing="roof" role="img" aria-label="Các vòng mái đã nâng góc và đỉnh kề góc."></svg>
      <div class="viz-controls">
        <button class="btn btn-secondary" type="button" aria-pressed="false" data-roof="flat">Vòng phẳng</button>
        <button class="btn btn-secondary" type="button" aria-pressed="true" data-roof="lifted">Nâng góc</button>
      </div>
    </figure>
  </div>
  <script>
  (() => {
    const root = document.getElementById("lamp-loft-lesson");
    const post = root.querySelector('[data-drawing="post"]');
    const ring = root.querySelector('[data-drawing="ring"]');
    const roof = root.querySelector('[data-drawing="roof"]');
    const buttons = [...root.querySelectorAll("[data-roof]")];
    const postLevels = [[.45,.72],[.52,.76],[.70,.68],[.94,.58],[1.19,.49],[1.44,.53],[1.68,.63],[1.92,.72]];
    const roofLevels = [
      [3.25,.98,0,0],[3.30,1.42,.03,.01],[3.36,1.84,.08,.035],[3.40,1.99,.14,.065],
      [3.46,2.05,.18,.085],[3.52,1.75,.075,.035],[3.62,1.29,.025,.01],[3.78,.85,0,0]
    ];
    const footprint = Array.from({length: 16}, (_, i) => {
      const t = -1 + (i % 4) * .5;
      return [[t,-1],[1,t],[-t,1],[-1,-t]][Math.floor(i / 4)];
    });
    let lifted = true;

    function viewport(svg) {
      const width = Math.max(120, Math.round(svg.getBoundingClientRect().width));
      svg.setAttribute("viewBox", `0 0 ${width} 152`);
      return width;
    }

    function points(coords) {
      return coords.map(([x,y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(" ");
    }

    function drawPost() {
      const width = viewport(post);
      const unit = 87;
      const left = postLevels.map(([z,w]) => [width / 2 - w * unit / 2, 140 - (z - .45) * unit]);
      const right = left.map(([x,y]) => [width - x,y]);
      const loops = left.map(([x,y], i) => `<line x1="${x}" y1="${y}" x2="${right[i][0]}" y2="${y}" stroke="${i === 4 ? "var(--corner)" : "var(--mesh)"}" />`);
      post.innerHTML = `<polygon class="lamp-mesh" points="${points(left.concat([...right].reverse()))}" fill="var(--face)" />
        <line x1="${width / 2}" y1="11" x2="${width / 2}" y2="140" stroke-dasharray="3 4" stroke="var(--mesh)" />
        ${loops.join("")}`;
    }

    function drawRing() {
      const width = viewport(ring);
      const unit = 52;
      const coords = footprint.map(([x,y]) => [width / 2 + x * unit,76 + y * unit]);
      const marks = coords.map(([x,y], i) => {
        if (i % 4 === 0) return `<circle cx="${x}" cy="${y}" r="5" fill="var(--corner)" />`;
        if (i % 4 === 2) return `<rect x="${x-3}" y="${y-3}" width="6" height="6" fill="var(--muted-foreground)" />`;
        return `<polygon points="${points([[x-4,y],[x,y-4],[x+4,y],[x,y+4]])}" fill="var(--neighbor)" />`;
      });
      ring.innerHTML = `<polygon class="lamp-mesh" points="${points(coords)}" fill="var(--face)" />${marks.join("")}`;
    }

    function drawRoof() {
      const width = viewport(roof);
      const unit = Math.min((width - 16) / 2.73, 86);
      const levels = roofLevels.map(([z,w,corner,neighbor]) => footprint.map(([x,y], i) => [
        x*w/2, y*w/2, z-3.25+(lifted ? [corner,neighbor,0,neighbor][i%4] : 0)
      ]));
      const project = ([x,y,z]) => [width/2+unit*(.86*x+.49*y),107+unit*(.21*x-.37*y-z)];
      const depth = ([x,y,z]) => .49*x-.86*y+.42*z;
      const faces = [];
      for (let level = 0; level < levels.length - 1; level++) {
        for (let i = 0; i < 16; i++) {
          const j = (i + 1) % 16;
          faces.push({vertices:[levels[level][i],levels[level][j],levels[level+1][j],levels[level+1][i]], fill:level % 2 ? "var(--face)" : "var(--light-face)"});
        }
      }
      faces.push({vertices:levels.at(-1), fill:"var(--light-face)"});
      const meanDepth = face => face.vertices.reduce((sum,p) => sum+depth(p),0)/face.vertices.length;
      const outlines = faces.sort((a,b) => meanDepth(a)-meanDepth(b)).map(face =>
        `<polygon class="lamp-mesh" points="${points(face.vertices.map(project))}" fill="${face.fill}" />`
      );
      const frontLip = levels[4].slice(0,9).map(project);
      roof.innerHTML = `${outlines.join("")}
        <polyline points="${points(frontLip)}" fill="none" stroke="var(--corner)" stroke-width="1.7" />`;
      roof.setAttribute("aria-label", lifted ? "Mái với đỉnh góc và đỉnh kề góc đã nâng." : "Mái tạo từ tám vòng còn phẳng.");
    }

    function setMode(mode, persist) {
      lifted = mode !== "flat";
      for (const button of buttons) button.setAttribute("aria-pressed", String(button.dataset.roof === (lifted ? "lifted" : "flat")));
      drawRoof();
      if (persist && window.openai?.setWidgetState) {
        window.openai.setWidgetState({modelContent:{roof:mode},privateContent:null}).catch(() => {});
      }
    }

    for (const button of buttons) button.addEventListener("click", () => setMode(button.dataset.roof, true));
    window.addEventListener("openai:set_globals", event => {
      const saved = event.detail?.globals?.widgetState?.modelContent?.roof;
      if (saved === "flat" || saved === "lifted") setMode(saved, false);
    });
    setMode(window.openai?.widgetState?.modelContent?.roof, false);
    drawPost();
    drawRing();
    const resize = new ResizeObserver(() => { drawPost(); drawRing(); drawRoof(); });
    for (const svg of [post, ring, roof]) resize.observe(svg);
  })();
  </script>
</div>
